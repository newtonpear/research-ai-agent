[project]
name = "research-ai-agent"
version = "0.1.0"
description = "A lightweight AI agent backend for research assistance and future WeChat/Web integration."
authors = [
    { name = "Your Name", email = "your_email@example.com" }
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
